<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otzovichok</title>
    <link rel="stylesheet" href="style/index.css">
    <script src="js/index.js">
</head>
<body>
<div class="wrap">
    <header class="topbar">
        <div class="logo">Otzovichok</div>

        <nav class="nav">
            <a style="color:blue">Главная</a>
            <a href="profile.html">Профиль</a>
            <a class="write-comment-href" id="writeCommentHref" href="newcomment.html">Оставить отзыв</a>
        </nav>
    </header>

    <section class="hero">
        <div class="card hero-card">
            <h1>Отзывы и комментарии разного сорта</h1>
            <div class="hero-actions" id="guest-actions">
                <p>
                    Чтобы оставлять отзывы или оценивать чужие, зарегистрируйтесь или войдите в аккаунт.
                </p>
                <a class="primary-btn" href="register.html">Зарегистрироваться</a>
                <a class="secondary-btn" href="login.html">Войти</a>
            </div>

        </div>

        <div class="card">
            <div class="stats-title">Общая статистика</div>

            <div class="stats-grid">
                <div class="stat">
                    <div class="stat-label">Всего комментариев</div>
                    <div class="stat-value" id="count-comments">0</div>
                </div>

                <div class="stat">
                    <div class="stat-label">Всего лайков</div>
                    <div class="stat-value" id="count-likes">0</div>
                </div>

                <div class="stat">
                    <div class="stat-label">Всего дизлайков</div>
                    <div class="stat-value" id="count-dislikes">0</div>
                </div>
            </div>
        </div>
    </section>

    <section class="card section-card">
        <div class="section-head">
            <div>
                <h2>Комментарии</h2>
            </div>

            <div class="comment-tools">
                <div class="comment-tools-row">
                    <input class="comment-search-input" type="text" id="searchTitle" placeholder="Поиск по заголовку">
                    <input class="comment-date-input" type="date" id="dateFrom">
                    <input class="comment-date-input" type="date" id="dateTo">
                </div>

                <div class="comment-tools-row">
                    <select class="comment-select" id="sortSelect">
                        <option value="date_desc">Сначала новые</option>
                        <option value="date_asc">Сначала старые</option>
                        <option value="grade_desc">Оценка по убыванию</option>
                        <option value="grade_asc">Оценка по возрастанию</option>
                    </select>

                    <select class="comment-select" id="limitSelect">
                        <option value="10">10</option>
                        <option value="20">20</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>

                    <button class="primary-btn" onclick="loadComments()">Найти</button>
                </div>
            </div>
        </div>
        <div class="comments-grid" id="comments-list">
            <div class="empty">Загрузка...</div>
        </div>
    </section>
</div>
</body>
</html>
