<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Написать отзыв</title>
    <link rel="stylesheet" href="style/newcomment.css">
    <script src="js/newcomment.js"></script>
</head>
<body>
<div class="wrap">
    <header class="topbar">
        <div class="logo">Otzovichok</div>

        <nav class="nav">
            <a href="index.html">Главная</a>
            <a href="profile.html">Профиль</a>
        </nav>
    </header>

    <section class="card section-card">
        <div class="section-head">
            <div>
                <h2>Написать отзыв</h2>
                <div class="muted">Расскажите о товаре, выберите категорию и поставьте оценку</div>
            </div>
        </div>

        <form id="commentForm" class="comment-form">
            <div class="field">
                <label for="title">Название товара</label>
                <input
                        type="text"
                        id="title"
                        name="title"
                        maxlength="200"
                        placeholder="Например: сыр Черный принц"
                        required
                >
            </div>

            <div class="field">
                <label>Категория</label>
                <div id="categoryContainer" class="category-container"></div>
                <small class="hint">Выберите конечную категорию</small>
            </div>

            <div class="field">
                <label for="comment">Комментарий</label>
                <textarea
                        id="comment"
                        name="comment"
                        rows="8"
                        placeholder="Опишите плюсы, минусы, опыт использования"
                        required
                ></textarea>
            </div>

            <div class="field">
                <label>Оценка</label>
                <div class="rating-block">
                    <div id="starRating" class="star-rating"></div>
                    <div id="ratingValue" class="rating-value">Оценка не выбрана</div>
                </div>
            </div>

            <div class="actions">
                <button type="submit" class="primary-btn submit-btn">Опубликовать отзыв</button>
                <a href="index.html" class="secondary-btn">Назад</a>
            </div>

            <div id="formMessage" class="form-message"></div>
        </form>
    </section>
</div>
</body>
</html>
